[project]
name = "neuroimaging-research-methods"
version = "0.1.0"
description = "Paper-led neuroimaging research methods course"
requires-python = ">=3.12,<3.15"
dependencies = [
  "numpy>=2,<3",
  "scipy>=1.14,<2",
  "matplotlib>=3.9,<4",
  "pandas>=2.2,<4",
  "scikit-learn>=1.5,<2",
  "nbformat>=5,<6",
  "nbclient>=0.10,<1",
  "ipykernel>=6,<8",
  "jupyterlab>=4,<5",
  "markdown>=3,<4",
  "nibabel>=5,<6",
  "nilearn>=0.12,<1",
]

[tool.uv]
package = false
