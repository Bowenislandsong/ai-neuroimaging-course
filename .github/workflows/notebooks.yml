name: Notebook checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python scripts/check_repository.py
      - run: python scripts/validate_notebooks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-validation
          path: build/validation.json
