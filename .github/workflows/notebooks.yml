name: Notebook checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-notebooks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: '0.11.7'
          enable-cache: true
      - run: bash ./setup.sh --check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notebook-validation
          path: build/validation.json
